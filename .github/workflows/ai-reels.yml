name: AI Reels / Shorts generator

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC (08:47 IST)
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos to generate"
        default: "1"
      topic:
        description: "Optional: force a topic instead of picking a trend"
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ai-reels-generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-reels-generator/requirements.txt

      - run: pip install -r requirements.txt

      # Remember which topics were already used so videos don't repeat.
      - name: Restore topic history
        uses: actions/cache/restore@v4
        with:
          path: ai-reels-generator/output/history.json
          key: reel-history-${{ github.run_id }}
          restore-keys: reel-history-

      - name: Generate videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REEL_GEO: ${{ vars.REEL_GEO }}
          REEL_LANGUAGE: ${{ vars.REEL_LANGUAGE }}
          REEL_VOICE: ${{ vars.REEL_VOICE }}
          REEL_NICHE: ${{ vars.REEL_NICHE }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          if [ -n "$TOPIC" ]; then
            python -m reelgen --count "$COUNT" --topic "$TOPIC"
          else
            python -m reelgen --count "$COUNT"
          fi

      - name: Save topic history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ai-reels-generator/output/history.json
          key: reel-history-${{ github.run_id }}

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_number }}
          path: |
            ai-reels-generator/output/*/reel.mp4
            ai-reels-generator/output/*/thumbnail.jpg
            ai-reels-generator/output/*/report.json
            ai-reels-generator/output/*/script.json
          if-no-files-found: warn
          retention-days: 14
